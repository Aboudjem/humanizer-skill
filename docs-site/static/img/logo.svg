<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" fill="none" role="img" aria-label="humanizer: an AI writing humanizer and detector. 55 patterns, 5 voices, nothing leaves your machine.">
  <title>humanizer</title>
  <desc>The humanizer wordmark beside a pen nib mark with one tapered ink stroke trailing from the tip, on a light ground with a thin horizon rule.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0.25" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#A836FF"/>
      <stop offset="100%" stop-color="#EB0054"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-0.10 0; 0.10 0; -0.10 0" dur="18s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="ll-rule" gradientUnits="userSpaceOnUse" x1="176" y1="48" x2="176" y2="146">
      <stop offset="0%" stop-color="#A836FF" stop-opacity="0"/>
      <stop offset="45%" stop-color="#A836FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#EB0054" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="ll-horizon" gradientUnits="userSpaceOnUse" x1="40" y1="152" x2="680" y2="152">
      <stop offset="0%" stop-color="#A836FF" stop-opacity="0"/>
      <stop offset="22%" stop-color="#A836FF" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#A836FF" stop-opacity="0.55"/>
      <stop offset="86%" stop-color="#EB0054" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#EB0054" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="ll-gridfade" gradientUnits="userSpaceOnUse" x1="0" y1="152" x2="0" y2="200">
      <stop offset="0%" stop-color="#A836FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#EB0054" stop-opacity="0.05"/>
    </linearGradient>

    <clipPath id="ll-gridclip"><rect x="0" y="152" width="720" height="48"/></clipPath>
  </defs>

  <style>
    .disp { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .word { font-size: 54px; font-weight: 800; letter-spacing: -2px; }
    .tag  { font-size: 11px; letter-spacing: 0.8px; fill: #48546B; }

    @keyframes ll-flow { to { stroke-dashoffset: -240; } }
    .flowline { animation: ll-flow 14s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <rect width="720" height="200" fill="#F7F8FB"/>

  <g id="grid" clip-path="url(#ll-gridclip)" opacity="0">
    <g stroke="url(#ll-gridfade)" stroke-width="1" fill="none">
      <path d="M360 152 L-420 200"/><path d="M360 152 L-60 200"/><path d="M360 152 L110 200"/>
      <path d="M360 152 L230 200"/><path d="M360 152 L310 200"/><path d="M360 152 L360 200"/>
      <path d="M360 152 L412 200"/><path d="M360 152 L494 200"/><path d="M360 152 L616 200"/>
      <path d="M360 152 L790 200"/><path d="M360 152 L1150 200"/>
    </g>
    <g stroke="url(#ll-gridfade)" stroke-width="1" fill="none">
      <line x1="0" y1="155" x2="720" y2="155"/>
      <line x1="0" y1="160" x2="720" y2="160"/>
      <line x1="0" y1="168" x2="720" y2="168"/>
      <line x1="0" y1="180" x2="720" y2="180"/>
      <line x1="0" y1="196" x2="720" y2="196"/>
    </g>
  </g>

  <g>
    <line x1="40" y1="152" x2="680" y2="152" stroke="#D8DEE9" stroke-width="1.25"/>
    <line class="flowline" x1="40" y1="152" x2="680" y2="152" stroke="url(#ll-horizon)"
          stroke-width="1.5" stroke-dasharray="3 9"/>
  </g>

  <g>
    <g transform="translate(84,118)">
      <path fill="url(#brand)" fill-rule="evenodd" d="M0 0 C-3.5 -14 -9 -24 -14 -33 C-17.5 -40 -18.5 -52 -16.5 -59 L-13 -64 L13 -64 L16.5 -59 C18.5 -52 17.5 -40 14 -33 C9 -24 3.5 -14 0 0 Z M-1.6 -10 L-1.6 -38 L1.6 -38 L1.6 -10 Z M-5.2 -43 A5.2 5.2 0 1 0 5.2 -43 A5.2 5.2 0 1 0 -5.2 -43 Z"/>
      <path fill="url(#brand)" d="M0 0 C18 3 40 9 72 9 C40 16 16 12 0 0 Z"/>
    </g>
    <text class="disp word" x="202" y="100" fill="url(#brand)">humanizer</text>
  </g>

  <line x1="176" y1="48" x2="176" y2="146" stroke="url(#ll-rule)" stroke-width="1.5"/>

  <text class="mono tag" x="204" y="130">55 patterns  &#183;  5 voices  &#183;  nothing leaves your machine</text>
</svg>

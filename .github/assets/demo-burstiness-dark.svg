<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" fill="none" role="img" aria-label="Sentence-length chart looping between AI (flat, uniform, red) and human (varied, 3 to 31 words, green). Humanizer restores the burstiness.">
  <title>Burstiness: AI is flat, humans vary</title>
  <desc>Thirteen sentence-length bars loop from a flat, uniform red AI baseline to a varied green human skyline (3 to 31 words) and back. Burstiness goes from about zero to plus 0.74.</desc>
  <defs>
    <radialGradient id="desk" cx="0.3" cy="0.12" r="1.1">
      <stop offset="0" stop-color="#1c2536"/>
      <stop offset="1" stop-color="#0f141e"/>
    </radialGradient>
    <filter id="barShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDev="2.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="8" y="10" width="704" height="180" rx="20" fill="url(#desk)" stroke="#e0574a" stroke-opacity="0.3" stroke-width="1.5"/>
  <rect x="8" y="10" width="704" height="4" rx="2" fill="#e0574a" opacity="0.85"/>

  <g opacity="1">
    <animate attributeName="opacity" values="1;0;0;1" keyTimes="0;0.14;0.86;1" dur="6.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1"/>
    <circle cx="44" cy="36" r="4" fill="#e0574a"/>
    <text x="56" y="40" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#e0574a">AI</text>
    <text x="76" y="40" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a9a08b">&#183; flat, uniform rhythm (every sentence &#8776;18 words)</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.16;0.86;1" dur="6.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1"/>
    <circle cx="44" cy="36" r="4" fill="#57c39a"/>
    <text x="56" y="40" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#57c39a">Human</text>
    <text x="108" y="40" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a9a08b">&#183; natural burstiness (3 to 31 words per sentence)</text>
  </g>

  <g stroke="#2c3a52" stroke-width="1">
    <line x1="40" y1="160" x2="548" y2="160"/>
    <line x1="40" y1="124" x2="548" y2="124" stroke-opacity="0.7"/>
    <line x1="40" y1="88" x2="548" y2="88" stroke-opacity="0.5"/>
  </g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" fill="none" role="img" aria-label="Sentence-length chart looping between AI (flat, uniform) and human (varied, 3 to 31 words). Humanizer restores the burstiness.">
  <title>Burstiness: AI is flat, humans vary</title>
  <desc>Thirteen sentence-length bars loop from a flat, uniform AI baseline to a varied human skyline (3 to 31 words) and back. Burstiness goes from about zero to plus 0.74.</desc>
  <defs>
    <linearGradient id="bd-ground" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#171029"/>
      <stop offset="60%" stop-color="#0A0F1C"/>
      <stop offset="100%" stop-color="#080C18"/>
    </linearGradient>

    <radialGradient id="bd-bloom" cx="0.5" cy="1" r="0.8">
      <stop offset="0%" stop-color="#FF2D78" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#7C3AED" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="bd-bars" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="548" y2="0">
      <stop offset="0%" stop-color="#C77DFF"/>
      <stop offset="100%" stop-color="#FF4D8D"/>
    </linearGradient>

    <linearGradient id="bd-axis" gradientUnits="userSpaceOnUse" x1="40" y1="160" x2="548" y2="160">
      <stop offset="0%" stop-color="#C77DFF" stop-opacity="0"/>
      <stop offset="30%" stop-color="#C77DFF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FF4D8D" stop-opacity="0.15"/>
    </linearGradient>
      <radialGradient id="v2-bloomA" cx="0.18" cy="0.22" r="0.72">
      <stop offset="0%" stop-color="#C77DFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#C77DFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="v2-bloomB" cx="0.84" cy="0.86" r="0.68">
      <stop offset="0%" stop-color="#FF4D8D" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#FF4D8D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .disp { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .lede  { font-size: 13px; fill: #C2CDE4; }
    .lede b { font-weight: 700; }
    .cardt { font-size: 11px; font-weight: 700; }
    .cardm { font-size: 10px; fill: #93A2BE; }
    .big   { font-size: 20px; font-weight: 800; }
    .pk    { font-size: 9px; font-weight: 700; fill: #C2CDE4; }
    .tag   { font-size: 10.5px; letter-spacing: 0.6px; fill: #93A2BE; }
    .wm    { font-size: 11px; font-weight: 800; fill: #F2F6FF; }

    @keyframes bd-ai    { 0%,40% { opacity: 1; }   48%,92% { opacity: 0; }   100% { opacity: 1; } }
    @keyframes bd-hum   { 0%,40% { opacity: 0; }   48%,92% { opacity: 1; }   100% { opacity: 0; } }

    .ai    { animation: bd-ai 8s ease-in-out infinite; }
    .hum   { animation: bd-hum 8s ease-in-out infinite; }

    @keyframes bd-flow { to { stroke-dashoffset: -240; } }
    .flowline { animation: bd-flow 14s linear infinite; }

    @keyframes bd-breathe { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
    .bloom { animation: bd-breathe 9s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
      @keyframes v2-breathe { 0%,100% { opacity:0.66; } 50% { opacity:1; } }
    .v2bloom { animation: v2-breathe 11s ease-in-out infinite; }
  </style>

  <rect width="720" height="200" fill="url(#bd-ground)"/>
  <g class="v2bloom"><rect width="720" height="200" fill="url(#v2-bloomA)"/><rect width="720" height="200" fill="url(#v2-bloomB)"/></g>
  <ellipse class="bloom" cx="360" cy="206" rx="470" ry="120" fill="url(#bd-bloom)"/>

  <g class="ai" opacity="0">
    <circle cx="44" cy="36" r="4" fill="#5C6A85"/>
    <text class="disp lede" x="56" y="40"><tspan font-weight="700" fill="#93A2BE">AI</tspan>  &#183;  flat, uniform rhythm (every sentence &#8776;18 words)</text>
  </g>
  <g class="hum" opacity="1">
    <circle cx="44" cy="36" r="4" fill="#C77DFF"/>
    <text class="disp lede" x="56" y="40"><tspan font-weight="700" fill="#C77DFF">Human</tspan>  &#183;  natural burstiness (3 to 31 words per sentence)</text>
  </g>

  <line x1="40" y1="104" x2="548" y2="104" stroke="#5C6A85" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.75"/>
  <text class="mono" x="34" y="107" font-size="8.5" text-anchor="end" fill="#93A2BE">&#8776;18</text>

  <g class="ai" opacity="0" fill="#5C6A85">
    <rect x="40"  y="104" width="28" height="56" rx="4"/>
    <rect x="80"  y="104" width="28" height="56" rx="4"/>
    <rect x="120" y="104" width="28" height="56" rx="4"/>
    <rect x="160" y="104" width="28" height="56" rx="4"/>
    <rect x="200" y="104" width="28" height="56" rx="4"/>
    <rect x="240" y="104" width="28" height="56" rx="4"/>
    <rect x="280" y="104" width="28" height="56" rx="4"/>
    <rect x="320" y="104" width="28" height="56" rx="4"/>
    <rect x="360" y="104" width="28" height="56" rx="4"/>
    <rect x="400" y="104" width="28" height="56" rx="4"/>
    <rect x="440" y="104" width="28" height="56" rx="4"/>
    <rect x="480" y="104" width="28" height="56" rx="4"/>
    <rect x="520" y="104" width="28" height="56" rx="4"/>
  </g>

  <g class="hum" opacity="1" fill="url(#bd-bars)">
    <rect x="40"  y="138" width="28" height="22" rx="4"/>
    <rect x="80"  y="72"  width="28" height="88" rx="4"/>
    <rect x="120" y="120" width="28" height="40" rx="4"/>
    <rect x="160" y="146" width="28" height="14" rx="4"/>
    <rect x="200" y="92"  width="28" height="68" rx="4"/>
    <rect x="240" y="130" width="28" height="30" rx="4"/>
    <rect x="280" y="64"  width="28" height="96" rx="4"/>
    <rect x="320" y="142" width="28" height="18" rx="4"/>
    <rect x="360" y="82"  width="28" height="78" rx="4"/>
    <rect x="400" y="124" width="28" height="36" rx="4"/>
    <rect x="440" y="148" width="28" height="12" rx="4"/>
    <rect x="480" y="102" width="28" height="58" rx="4"/>
    <rect x="520" y="114" width="28" height="46" rx="4"/>
  </g>

  <g class="hum" opacity="1" text-anchor="middle">
    <text class="disp pk" x="294" y="58">31</text>
    <text class="disp pk" x="94"  y="66">29</text>
    <text class="disp pk" x="374" y="76">26</text>
    <text class="disp pk" x="174" y="140">4</text>
    <text class="disp pk" x="454" y="142">3</text>
  </g>

  <g>
    <line x1="40" y1="160" x2="548" y2="160" stroke="#1E2A42" stroke-width="1.25"/>
    <line class="flowline" x1="40" y1="160" x2="548" y2="160" stroke="url(#bd-axis)"
          stroke-width="1.5" stroke-dasharray="3 9"/>
  </g>

  <rect x="574" y="56" width="122" height="96" rx="12" fill="#0E1524" stroke="#1E2A42" stroke-width="1"/>
  <g class="ai" opacity="0">
    <text class="disp cardt" x="590" y="80" fill="#93A2BE">AI &#183; uniform</text>
    <text class="disp cardm" x="590" y="98">18, 18, 19, 18&#8230;</text>
    <text class="disp cardm" x="590" y="122">Burstiness</text>
    <text class="disp big"   x="590" y="142" fill="#FFB341">&#8722;0.02</text>
  </g>
  <g class="hum" opacity="1">
    <text class="disp cardt" x="590" y="80" fill="#C77DFF">Human &#183; varied</text>
    <text class="disp cardm" x="590" y="98">3 &#8594; 31 words</text>
    <text class="disp cardm" x="590" y="122">Burstiness</text>
    <text class="disp big"   x="590" y="142" fill="#3DFFAB">+0.74</text>
  </g>

  <text class="disp wm"  x="40"  y="184">humanizer</text>
  <text class="disp tag" x="112" y="184">restores the rhythm humans actually write in</text>
</svg>

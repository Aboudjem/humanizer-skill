<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" fill="none">
  <style>
    @keyframes write { 0%,100% { transform: translateX(0); } 50% { transform: translateX(3px); } }
    @keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
    .line1 { animation: pulse 2.5s ease-in-out infinite; }
    .line2 { animation: pulse 2.5s ease-in-out infinite 0.4s; }
    .line3 { animation: pulse 2.5s ease-in-out infinite 0.8s; }
    .line4 { animation: pulse 2.5s ease-in-out infinite 1.2s; }
    .pen-group { animation: write 3s ease-in-out infinite; }
  </style>
  <rect x="10" y="20" width="700" height="160" rx="24" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.2"/>
  <!-- Document with text lines -->
  <g transform="translate(45, 45)">
    <!-- Paper -->
    <rect x="0" y="8" width="58" height="78" rx="6" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="6" y="0" width="58" height="78" rx="6" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <!-- Text lines on paper -->
    <line class="line1" x1="16" y1="18" x2="52" y2="18" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round"/>
    <line class="line2" x1="16" y1="30" x2="46" y2="30" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round"/>
    <line class="line3" x1="16" y1="42" x2="50" y2="42" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round"/>
    <line class="line4" x1="16" y1="54" x2="40" y2="54" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Fountain pen overlapping the document -->
    <g class="pen-group" transform="translate(42, 20) rotate(35)">
      <!-- Pen barrel -->
      <rect x="0" y="-4" width="48" height="8" rx="3" fill="#7c3aed"/>
      <!-- Pen grip -->
      <rect x="-8" y="-3.5" width="12" height="7" rx="2" fill="#6d28d9"/>
      <!-- Pen nib -->
      <path d="M -8,-2.5 L -18,0 L -8,2.5 Z" fill="#c4b5fd"/>
      <path d="M -18,0 L -14,-0.8 L -14,0.8 Z" fill="#8b5cf6"/>
      <!-- Pen clip -->
      <rect x="20" y="-6.5" width="14" height="2" rx="1" fill="#6d28d9"/>
      <!-- Ink dot at nib tip -->
      <circle cx="-18" cy="0" r="1.5" fill="#7c3aed" opacity="0.8"/>
    </g>
  </g>
  <!-- Title -->
  <text x="175" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="#1e1b4b" letter-spacing="-1">humanizer</text>
  <!-- Subtitle -->
  <text x="175" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="17" fill="#8b5cf6" font-weight="500">Make AI Text Undetectable</text>
  <!-- Tagline -->
  <text x="175" y="147" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748b">37 patterns  ·  5 voices  ·  90+ research sources  ·  Zero deps</text>
</svg>

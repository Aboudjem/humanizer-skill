<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" fill="none">
  <style>
    @keyframes pulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
    .dot { animation: pulse 2s ease-in-out infinite; }
    .dot:nth-child(2) { animation-delay: 0.3s; }
    .dot:nth-child(3) { animation-delay: 0.6s; }
  </style>
  <rect x="10" y="20" width="700" height="160" rx="24" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.2"/>
  <!-- Pen/writing icon -->
  <g transform="translate(55, 55)">
    <rect x="10" y="5" width="65" height="85" rx="8" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="2"/>
    <!-- Lines of text -->
    <line class="dot" x1="22" y1="25" x2="62" y2="25" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <line class="dot" x1="22" y1="40" x2="55" y2="40" stroke="#a78bfa" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <line class="dot" x1="22" y1="55" x2="58" y2="55" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <line class="dot" x1="22" y1="70" x2="48" y2="70" stroke="#a78bfa" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <!-- Pen -->
    <path d="M 68 0 L 78 10 L 72 16 L 62 6 Z" fill="#8b5cf6"/>
    <path d="M 62 6 L 58 18 L 68 14 Z" fill="#a78bfa"/>
  </g>
  <!-- Title -->
  <text x="175" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="#1e1b4b" letter-spacing="-1">humanizer</text>
  <!-- Subtitle -->
  <text x="175" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="17" fill="#8b5cf6" font-weight="500">Make AI Text Undetectable</text>
  <!-- Tagline -->
  <text x="175" y="147" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748b">30 patterns · 5 voices · 90+ research sources · Zero deps</text>
</svg>

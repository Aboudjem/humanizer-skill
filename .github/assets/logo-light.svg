<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" fill="none" role="img" aria-label="Humanizer: a red editing pen strikes through an AI-sounding phrase and writes a plain correction above it, then checks it off, on a loop. 55 patterns, 5 voices, 3 modes, zero dependencies.">
  <title>Humanizer</title>
  <desc>A red pen strikes through an AI-sounding phrase on a manuscript page, writes a plainer correction above it, and checks it off, on a loop. Detect 55 AI writing patterns and rewrite text so it sounds like a human wrote it. 5 voices, 3 modes, zero dependencies.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#f3ead4"/>
    </linearGradient>
    <filter id="pageShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDev="5" flood-color="#6b5a3a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="708" height="208" rx="20" fill="url(#page)" stroke="#c0392b" stroke-opacity="0.22" stroke-width="1.5" filter="url(#pageShadow)"/>
  <rect x="6" y="6" width="708" height="4" rx="2" fill="#c0392b" opacity="0.85"/>

  <text x="40" y="98" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="54" font-weight="800" letter-spacing="-2" fill="#211c15">Humanizer</text>
  <line x1="42" y1="114" x2="300" y2="114" stroke="#c0392b" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="258" stroke-dashoffset="258">
    <animate attributeName="stroke-dashoffset" values="258;0" dur="0.8s" begin="0.7s" calcMode="spline" keySplines="0.16 1 0.3 1" fill="freeze"/>
  </line>
  <text x="42" y="146" font-family="system-ui,-apple-system,sans-serif" font-size="17.5" font-weight="600" fill="#4a4238">Make AI text sound like a human wrote it.</text>
  <text x="42" y="174" font-family="system-ui,-apple-system,sans-serif" font-size="14.5" fill="#8a7f6b">55 patterns &#183; 5 voices &#183; 3 modes &#183; zero dependencies</text>

  <g transform="translate(432,34)">
    <rect x="0" y="0" width="252" height="150" rx="10" fill="#fffef9" stroke="#e7dcc6" stroke-width="1"/>

    <text x="18" y="46" font-family="Georgia,'Times New Roman',serif" font-size="15" fill="#2b2620">This comprehensive guide</text>
    <text x="18" y="74" font-family="Georgia,'Times New Roman',serif" font-size="15" fill="#2b2620">delves into the intricacies</text>
    <text x="18" y="102" font-family="Georgia,'Times New Roman',serif" font-size="15" fill="#2b2620">of authentication.</text>

    <line x1="18" y1="70" x2="88" y2="70" stroke="#c0392b" stroke-width="2" stroke-linecap="round" stroke-dasharray="70" stroke-dashoffset="70">
      <animate attributeName="stroke-dashoffset" values="70;70;0;0;70" keyTimes="0;0.08;0.24;0.82;1" dur="4.8s" begin="0.4s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.16 1 0.3 1;0 0 1 1;0.5 0 0.5 1"/>
    </line>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.26;0.34;0.82;1" dur="4.8s" begin="0.4s" repeatCount="indefinite"/>
      <path d="M20,66 C24,60 34,60 38,64" stroke="#c0392b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <text x="18" y="58" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="13" fill="#c0392b">explains</text>
    </g>

    <g transform="translate(214,124)" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.42;0.48;0.82;1" dur="4.8s" begin="0.4s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="12" fill="none" stroke="#2f7d5b" stroke-width="1.6" stroke-dasharray="76" stroke-dashoffset="76">
        <animate attributeName="stroke-dashoffset" values="76;76;0;0;76" keyTimes="0;0.42;0.54;0.82;1" dur="4.8s" begin="0.4s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.16 1 0.3 1;0 0 1 1;0.5 0 0.5 1"/>
      </circle>
      <path d="M-5,0 L-1.5,4 L5,-4.5" stroke="#2f7d5b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="16" stroke-dashoffset="16">
        <animate attributeName="stroke-dashoffset" values="16;16;0;0;16" keyTimes="0;0.5;0.58;0.82;1" dur="4.8s" begin="0.4s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.16 1 0.3 1;0 0 1 1;0.5 0 0.5 1"/>
      </path>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" fill="none" role="img" aria-label="Humanizer social card: a red editing pen strikes through an AI-sounding phrase and corrects it by hand. 55 patterns, 5 voices, zero dependencies.">
  <title>Humanizer</title>
  <desc>A red pen strikes through an AI-sounding phrase on a manuscript page and writes a plainer correction above it. 55 patterns, 5 voices, zero dependencies.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#f3ead4"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#page)"/>
  <rect x="0" y="0" width="1280" height="8" fill="#c0392b" opacity="0.9"/>

  <text x="120" y="180" font-family="'Segoe UI',Arial,system-ui,-apple-system,sans-serif" font-size="96" font-weight="800" letter-spacing="-3" fill="#211c15">Humanizer</text>
  <line x1="124" y1="204" x2="612" y2="204" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>

  <text x="120" y="258" font-family="system-ui,-apple-system,sans-serif" font-size="34" fill="#4a4238">Make AI text sound like a human wrote it.</text>
  <text x="120" y="300" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#8a7f6b">A pure-Markdown Claude Code skill. One file, zero dependencies.</text>

  <g transform="translate(120,340)">
    <rect x="0" y="0" width="560" height="150" rx="14" fill="#fffef9" stroke="#e7dcc6" stroke-width="1.5"/>

    <text x="26" y="46" font-family="Georgia,'Times New Roman',serif" font-size="27" fill="#2b2620">This comprehensive guide</text>
    <text x="26" y="94" font-family="Georgia,'Times New Roman',serif" font-size="27" fill="#2b2620">delves into the intricacies</text>
    <text x="26" y="132" font-family="Georgia,'Times New Roman',serif" font-size="27" fill="#2b2620">of authentication.</text>

    <line x1="26" y1="86" x2="156" y2="86" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>

    <path d="M28,80 C34,70 50,70 58,77" stroke="#c0392b" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="26" y="69" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="22" fill="#c0392b">explains</text>

    <g transform="translate(508,120)">
      <circle cx="0" cy="0" r="20" fill="none" stroke="#2f7d5b" stroke-width="2.5"/>
      <path d="M-8,0 L-2.5,7 L8,-8" stroke="#2f7d5b" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <g font-family="system-ui,-apple-system,sans-serif" font-weight="700" font-size="21">
    <rect x="732" y="340" width="176" height="46" rx="23" fill="#1f3a5f" opacity="0.08"/>
    <text x="758" y="370" fill="#1f3a5f">55 patterns</text>

    <rect x="924" y="340" width="140" height="46" rx="23" fill="#c0392b" opacity="0.12"/>
    <text x="950" y="370" fill="#8f271d">5 voices</text>

    <rect x="1080" y="340" width="200" height="46" rx="23" fill="#2f7d5b" opacity="0.13"/>
    <text x="1104" y="370" fill="#2f7d5b">0 dependencies</text>
  </g>

  <text x="1160" y="600" font-family="system-ui,-apple-system,sans-serif" font-size="22" fill="#8a7f6b" text-anchor="end">github.com/Aboudjem/humanizer-skill</text>
</svg>

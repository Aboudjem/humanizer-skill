<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" fill="none" role="img" aria-label="humanizer: an AI writing humanizer and detector. Reads like a person wrote it. 55 patterns, 5 voices, zero setup, and nothing leaves your machine.">
  <title>humanizer</title>
  <desc>The humanizer wordmark on a dark ground with the line Reads like a person wrote it, and the repository address github.com/Aboudjem/humanizer-skill.</desc>
  <defs>
    <linearGradient id="sp-ground" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#0A0F1C"/>
      <stop offset="60%" stop-color="#080C16"/>
      <stop offset="100%" stop-color="#07070C"/>
    </linearGradient>

    <radialGradient id="sp-bloom" cx="0.5" cy="1" r="0.75">
      <stop offset="0%" stop-color="#FF2D78" stop-opacity="0.30"/>
      <stop offset="38%" stop-color="#7C3AED" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sp-brand" x1="0" y1="0" x2="1" y2="0.25" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#C77DFF"/>
      <stop offset="100%" stop-color="#FF4D8D"/>
    </linearGradient>

    <linearGradient id="sp-horizon" gradientUnits="userSpaceOnUse" x1="90" y1="520" x2="1190" y2="520">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="22%" stop-color="#C77DFF" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#C77DFF" stop-opacity="0.8"/>
      <stop offset="82%" stop-color="#FF4D8D" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF4D8D" stop-opacity="0"/>
    </linearGradient>

    <filter id="sp-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .disp { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  </style>

  <rect width="1280" height="640" fill="url(#sp-ground)"/>
  <ellipse cx="640" cy="648" rx="780" ry="250" fill="url(#sp-bloom)" opacity="0.85"/>

  <line x1="90" y1="520" x2="1190" y2="520" stroke="url(#sp-horizon)" stroke-width="1.5"/>

  <text class="mono" x="100" y="206" font-size="18" font-weight="600" letter-spacing="6" fill="#C77DFF">AI WRITING HUMANIZER AND DETECTOR</text>

  <g filter="url(#sp-glow)">
    <text class="disp" x="100" y="316" font-size="104" font-weight="800" letter-spacing="-4" fill="url(#sp-brand)">humanizer</text>
  </g>

  <text class="disp" x="100" y="380" font-size="38" font-weight="700" letter-spacing="-0.5" fill="#F2F6FF">Reads like a person wrote it</text>
  <text class="disp" x="100" y="424" font-size="24" font-weight="500" fill="#B6C2DA">55 patterns, 5 voices, zero setup, and nothing leaves your machine.</text>

  <text class="mono" x="100" y="576" font-size="22" letter-spacing="1.6" fill="#8494B0">github.com/Aboudjem/humanizer-skill</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 236" fill="none" role="img" aria-label="A manuscript page runs /humanizer with --voice technical --score. Three AI tells are flagged and struck, then replaced by clean human prose; the AI-tell score drops from 84 to 12.">
  <title>humanizer: the command, the flagged phrases, and the rewrite</title>
  <desc>The command /humanizer "This comprehensive guide…" --voice technical --score runs. The AI phrase has comprehensive, delves into, and pivotal struck through. The clean rewrite reads: the auth system uses JWTs, tokens expire after 15 min. The AI-tell score falls from 84 to 12.</desc>
  <defs>
    <linearGradient id="td-ground" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#171029"/>
      <stop offset="60%" stop-color="#0A0F1C"/>
      <stop offset="100%" stop-color="#080C18"/>
    </linearGradient>

    <radialGradient id="td-bloom" cx="0.5" cy="1" r="0.8">
      <stop offset="0%" stop-color="#FF2D78" stop-opacity="0.14"/>
      <stop offset="45%" stop-color="#7C3AED" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="td-hairline" gradientUnits="userSpaceOnUse" x1="26" y1="76" x2="694" y2="76">
      <stop offset="0%" stop-color="#C77DFF" stop-opacity="0"/>
      <stop offset="30%" stop-color="#C77DFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FF4D8D" stop-opacity="0.1"/>
    </linearGradient>

    <clipPath id="td-cmdclip"><rect class="type" x="26" y="42" width="530" height="24"/></clipPath>
    <clipPath id="td-humclip"><rect class="reveal" x="384" y="104" width="210" height="94"/></clipPath>
      <radialGradient id="v2-bloomA" cx="0.18" cy="0.22" r="0.72">
      <stop offset="0%" stop-color="#C77DFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#C77DFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="v2-bloomB" cx="0.84" cy="0.86" r="0.68">
      <stop offset="0%" stop-color="#FF4D8D" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#FF4D8D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .disp { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .cmd   { font-size: 13px; }
    .badge { font-size: 10px; font-weight: 700; letter-spacing: 1px; }
    .prose { font-size: 16px; fill: #C2CDE4; }
    .lead  { font-size: 16px; font-weight: 700; fill: #F2F6FF; }
    .wm    { font-size: 11px; font-weight: 800; fill: #F2F6FF; }

    @keyframes td-type   { 0% { transform: translateX(-530px); } 20%,92% { transform: translateX(0); } 100% { transform: translateX(-530px); } }
    .type { animation: td-type 7s ease-in-out infinite; }

    @keyframes td-reveal { 0%,52% { transform: translateX(-210px); } 68%,92% { transform: translateX(0); } 100% { transform: translateX(-210px); } }
    .reveal { animation: td-reveal 7s ease-in-out infinite; }

    @keyframes td-s1 { 0%,30% { stroke-dashoffset: 120; } 42%,92% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 120; } }
    @keyframes td-s2 { 0%,33% { stroke-dashoffset: 120; } 45%,92% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 120; } }
    @keyframes td-s3 { 0%,36% { stroke-dashoffset: 120; } 48%,92% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 120; } }
    .s1 { animation: td-s1 7s ease-out infinite; }
    .s2 { animation: td-s2 7s ease-out infinite; }
    .s3 { animation: td-s3 7s ease-out infinite; }

    @keyframes td-flag { 0%,26% { fill: #C2CDE4; } 34%,92% { fill: #FF4D8D; } 100% { fill: #C2CDE4; } }
    .flag { animation: td-flag 7s ease-in-out infinite; }

    @keyframes td-score { 0%,56% { opacity: 0; } 66%,92% { opacity: 1; } 100% { opacity: 0; } }
    .score { animation: td-score 7s ease-in-out infinite; }

    @keyframes td-arrow { 0%,46% { opacity: 0.25; } 56%,92% { opacity: 1; } 100% { opacity: 0.25; } }
    .arrow { animation: td-arrow 7s ease-in-out infinite; }

    @keyframes td-caret { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    .caret { animation: td-caret 0.9s steps(1,end) infinite; }

    @keyframes td-breathe { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
    .bloom { animation: td-breathe 9s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
      @keyframes v2-breathe { 0%,100% { opacity:0.66; } 50% { opacity:1; } }
    .v2bloom { animation: v2-breathe 11s ease-in-out infinite; }
  </style>

  <rect width="720" height="236" fill="url(#td-ground)"/>
  <g class="v2bloom"><rect width="720" height="236" fill="url(#v2-bloomA)"/><rect width="720" height="236" fill="url(#v2-bloomB)"/></g>
  <ellipse class="bloom" cx="360" cy="242" rx="470" ry="130" fill="url(#td-bloom)"/>

  <g clip-path="url(#td-cmdclip)" class="mono cmd">
    <text x="26" y="59" fill="#C77DFF" font-weight="700">/humanizer</text>
    <text x="110" y="59" fill="#93A2BE">"This comprehensive guide&#8230;"</text>
    <text x="338" y="59" fill="#FF4D8D" font-weight="700">--voice</text>
    <text x="396" y="59" fill="#F2F6FF">technical</text>
    <text x="474" y="59" fill="#FF4D8D" font-weight="700">--score</text>
    <rect class="caret" x="530" y="47" width="2.5" height="14" fill="#C77DFF"/>
  </g>

  <line x1="26" y1="76" x2="694" y2="76" stroke="url(#td-hairline)" stroke-width="1.25"/>

  <text class="disp badge" x="30" y="100" fill="#FFB341">FLAGGED</text>
  <text class="mono badge" x="102" y="100" fill="#FFB341">[84/100]</text>

  <text class="disp badge" x="392" y="100" fill="#3DFFAB">HUMANIZED</text>
  <g class="score" opacity="1">
    <text class="mono badge" x="482" y="100" fill="#3DFFAB">[12/100]</text>
  </g>

  <g>
    <text class="disp prose" x="30" y="128">This</text>
    <text class="disp prose flag" x="64" y="128" fill="#FF4D8D">comprehensive</text>
    <text class="disp prose" x="180" y="128">guide</text>
    <line class="s1" x1="64" y1="122" x2="175" y2="122" stroke="#FF4D8D" stroke-width="2"
          stroke-linecap="round" stroke-dasharray="120 120" stroke-dashoffset="0"/>

    <text class="disp prose flag" x="30" y="156" fill="#FF4D8D">delves into</text>
    <text class="disp prose" x="115" y="156">the</text>
    <line class="s2" x1="30" y1="150" x2="108" y2="150" stroke="#FF4D8D" stroke-width="2"
          stroke-linecap="round" stroke-dasharray="120 120" stroke-dashoffset="0"/>

    <text class="disp prose flag" x="30" y="184" fill="#FF4D8D">pivotal</text>
    <text class="disp prose" x="84" y="184">aspects of auth.</text>
    <line class="s3" x1="30" y1="178" x2="76" y2="178" stroke="#FF4D8D" stroke-width="2"
          stroke-linecap="round" stroke-dasharray="120 120" stroke-dashoffset="0"/>
  </g>

  <line x1="360" y1="90" x2="360" y2="200" stroke="#1E2A42" stroke-width="1" stroke-dasharray="4 3"/>
  <g class="arrow" opacity="1" transform="translate(360,148)">
    <circle cx="0" cy="0" r="15" fill="#C77DFF" opacity="0.14"/>
    <path d="M-5 -5 L6 0 L-5 5" stroke="#C77DFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <g clip-path="url(#td-humclip)">
    <text class="disp lead"  x="390" y="128">The auth system</text>
    <text class="disp prose" x="390" y="156">uses JWTs. Tokens</text>
    <text class="disp prose" x="390" y="184">expire after 15 min.</text>
    <rect class="caret" x="540" y="171" width="2.5" height="15" fill="#3DFFAB"/>
  </g>

  <text class="disp wm" x="612" y="218" opacity="0.7">humanizer</text>
</svg>

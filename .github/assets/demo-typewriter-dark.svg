<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" fill="none" role="img" aria-label="Before and after: three AI tells (comprehensive, delves into, pivotal) are flagged and struck, then replaced by clean human prose.">
  <title>Before and after: AI tells struck and rewritten</title>
  <desc>The AI phrase 'This comprehensive guide delves into the pivotal aspects of auth' has comprehensive, delves into, and pivotal flagged in rust and struck through. The clean rewrite reads: the auth system uses JWTs, tokens expire after 15 minutes.</desc>
  <defs>
    <radialGradient id="desk" cx="0.5" cy="0.1" r="1.1">
      <stop offset="0" stop-color="#1c2536"/>
      <stop offset="1" stop-color="#0f141e"/>
    </radialGradient>
    <clipPath id="revealD"><rect x="384" y="62" width="0" height="90"><animate attributeName="width" values="0;196" dur="0.9s" begin="1.65s" calcMode="spline" keySplines="0.16 1 0.3 1" fill="freeze"/></rect></clipPath>
  </defs>

  <rect x="8" y="12" width="704" height="176" rx="20" fill="url(#desk)" stroke="#c0952f" stroke-opacity="0.3" stroke-width="1.5"/>
  <rect x="8" y="12" width="704" height="4" rx="2" fill="#c0952f" opacity="0.7"/>

  <text x="34" y="44" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="700" fill="#df7a54" letter-spacing="1">AI OUTPUT</text>
  <text x="390" y="44" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="700" fill="#57c39a" letter-spacing="1">HUMANIZED</text>

  <!-- AI side: flag, strike, then dim -->
  <g>
    <animate attributeName="opacity" values="1;0.4" dur="0.5s" begin="1.6s" calcMode="spline" keySplines="0.4 0 0.2 1" fill="freeze"/>

    <g fill="#4a2418" opacity="0">
      <animate attributeName="opacity" values="0;0.7" dur="0.3s" begin="0.4s" fill="freeze"/>
      <rect x="70" y="70" width="120" height="22" rx="3"/>
      <rect x="32" y="98" width="88" height="22" rx="3"/>
      <rect x="32" y="126" width="58" height="22" rx="3"/>
    </g>

    <text x="34" y="86" font-family="system-ui,-apple-system,sans-serif" font-size="16" fill="#e8e1cf">This</text>
    <text x="72" y="86" font-family="system-ui,-apple-system,sans-serif" font-size="16" fill="#e8e1cf">comprehensive<animate attributeName="fill" values="#e8e1cf;#df7a54" dur="0.3s" begin="0.4s" fill="freeze"/></text>
    <text x="194" y="86" font-family="system-ui,-apple-system,sans-serif" font-size="16" fill="#e8e1cf">guide</text>
    <line x1="72" y1="79" x2="186" y2="79" stroke="#df7a54" stroke-width="2" stroke-dasharray="114" stroke-dashoffset="114"><animate attributeName="stroke-dashoffset" values="114;0" dur="0.35s" begin="0.95s" calcMode="spline" keySplines="0.16 1 0.3 1" fill="freeze"/></line>

    <text x="34" y="114" font-family="system-ui,-apple-system,sans-serif" font-size="16" fill="#e8e1cf">delves into<animate attributeName="fill" values="#e8e1cf;#df7a54" dur="0.3s" begin="0.5s" fill="freeze"/></text>
    <text x="124" y="114" font-family="system-ui,-apple-system,sans-serif" font-size="16" fill="#e8e1cf">the</text>
    <line x1="34" y1="107" x2="120" y2="107" stroke="#df7a54" stroke-width="2" stroke-dasharray="86" stroke-dashoffset="86"><animate attributeName="stroke-dashoffset" values="86;0" dur="0.35s" begin="1.05s" calcMode="spline" keySplines="0.16 1 0.3 1" fill="freeze"/></line>

    <text x="34" y="142" font-family="system-ui,-apple-system,sans-serif" font-size="16" fill="#e8e1cf">pivotal<animate attributeName="fill" values="#e8e1cf;#df7a54" dur="0.3s" begin="0.6s" fill="freeze"/></text>
    <text x="96" y="142" font-family="system-ui,-apple-system,sans-serif" font-size="16" fill="#e8e1cf">aspects of auth.</text>
    <line x1="34" y1="135" x2="92" y2="135" stroke="#df7a54" stroke-width="2" stroke-dasharray="58" stroke-dashoffset="58"><animate attributeName="stroke-dashoffset" values="58;0" dur="0.35s" begin="1.15s" calcMode="spline" keySplines="0.16 1 0.3 1" fill="freeze"/></line>
  </g>

  <!-- divider + arrow -->
  <line x1="360" y1="36" x2="360" y2="164" stroke="#c0952f" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="4,3"/>
  <g transform="translate(360,100)" opacity="0.2">
    <animate attributeName="opacity" values="0.2;1" dur="0.5s" begin="1.45s" calcMode="spline" keySplines="0.34 1.56 0.64 1" fill="freeze"/>
    <circle cx="0" cy="0" r="15" fill="#c0952f" opacity="0.22"/>
    <path d="M-5,-5 L6,0 L-5,5" stroke="#e0b85e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Human side: typewriter clip reveal -->
  <g clip-path="url(#revealD)">
    <text x="390" y="86" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#57c39a">The auth system</text>
    <text x="390" y="114" font-family="system-ui,-apple-system,sans-serif" font-size="16" fill="#e8e1cf">uses JWTs. Tokens</text>
    <text x="390" y="142" font-family="system-ui,-apple-system,sans-serif" font-size="16" fill="#e8e1cf">expire after 15 min.</text>
  </g>
  <rect x="556" y="130" width="2" height="16" rx="1" fill="#57c39a" opacity="0">
    <animate attributeName="opacity" values="0;1;0;1;0;1;1" keyTimes="0;0.63;0.69;0.75;0.81;0.87;1" dur="4s" fill="freeze"/>
  </rect>

  <text x="612" y="180" font-family="system-ui,-apple-system,sans-serif" font-size="10.5" font-weight="700" fill="#e0b85e" opacity="0.7">humanizer</text>
</svg>

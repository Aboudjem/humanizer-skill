<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" fill="none" role="img" aria-label="humanizer: an AI writing humanizer and detector. 55 patterns, 5 voices, nothing leaves your machine.">
  <title>humanizer</title>
  <desc>The humanizer wordmark beside a pen nib mark with one tapered ink stroke trailing from the tip, on a dark ground with a horizon hairline and a small sunset disc at the right edge.</desc>
  <defs>
    <linearGradient id="ld-ground" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#0A0F1C"/>
      <stop offset="60%" stop-color="#080C16"/>
      <stop offset="100%" stop-color="#07070C"/>
    </linearGradient>

    <radialGradient id="ld-bloom" cx="0.5" cy="1" r="0.75">
      <stop offset="0%" stop-color="#FF2D78" stop-opacity="0.30"/>
      <stop offset="38%" stop-color="#7C3AED" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ld-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB341"/>
      <stop offset="40%" stop-color="#FF4D8D"/>
      <stop offset="100%" stop-color="#C77DFF"/>
    </linearGradient>

    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0.25" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#C77DFF"/>
      <stop offset="100%" stop-color="#FF4D8D"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-0.10 0; 0.10 0; -0.10 0" dur="18s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="ld-rule" gradientUnits="userSpaceOnUse" x1="176" y1="48" x2="176" y2="146">
      <stop offset="0%" stop-color="#C77DFF" stop-opacity="0"/>
      <stop offset="45%" stop-color="#C77DFF" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#FF4D8D" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="ld-horizon" gradientUnits="userSpaceOnUse" x1="40" y1="152" x2="680" y2="152">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="22%" stop-color="#C77DFF" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#C77DFF" stop-opacity="0.8"/>
      <stop offset="86%" stop-color="#FF4D8D" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF4D8D" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="ld-gridfade" gradientUnits="userSpaceOnUse" x1="0" y1="152" x2="0" y2="200">
      <stop offset="0%" stop-color="#C77DFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FF4D8D" stop-opacity="0.05"/>
    </linearGradient>

    <filter id="ld-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="ld-glow-atmo" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="22" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="ld-sunclip"><circle cx="652" cy="130" r="22"/></clipPath>
    <clipPath id="ld-gridclip"><rect x="0" y="152" width="720" height="48"/></clipPath>
  </defs>

  <style>
    .disp { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .word { font-size: 54px; font-weight: 800; letter-spacing: -2px; }
    .tag  { font-size: 11px; letter-spacing: 0.8px; fill: #8494B0; }

    @keyframes ld-breathe { 0%,100% { opacity: 0.55; } 50% { opacity: 0.95; } }
    .bloom { animation: ld-breathe 9s ease-in-out infinite; }

    @keyframes ld-sunpulse { 0%,100% { opacity: 0.42; } 50% { opacity: 0.62; } }
    .sun { animation: ld-sunpulse 10s ease-in-out infinite; }

    @keyframes ld-flow { to { stroke-dashoffset: -240; } }
    .flowline { animation: ld-flow 14s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <rect width="720" height="200" fill="url(#ld-ground)"/>
  <ellipse class="bloom" cx="360" cy="206" rx="460" ry="110" fill="url(#ld-bloom)"/>

  <g class="sun">
    <g filter="url(#ld-glow-atmo)">
      <circle cx="652" cy="130" r="22" fill="url(#ld-sun)"/>
    </g>
    <g clip-path="url(#ld-sunclip)" fill="#080C16">
      <rect x="624" y="133" width="56" height="1.6"/>
      <rect x="624" y="138.5" width="56" height="2.2"/>
      <rect x="624" y="145" width="56" height="3"/>
    </g>
  </g>

  <g id="grid" clip-path="url(#ld-gridclip)" opacity="0">
    <g stroke="url(#ld-gridfade)" stroke-width="1" fill="none">
      <path d="M360 152 L-420 200"/><path d="M360 152 L-60 200"/><path d="M360 152 L110 200"/>
      <path d="M360 152 L230 200"/><path d="M360 152 L310 200"/><path d="M360 152 L360 200"/>
      <path d="M360 152 L412 200"/><path d="M360 152 L494 200"/><path d="M360 152 L616 200"/>
      <path d="M360 152 L790 200"/><path d="M360 152 L1150 200"/>
    </g>
    <g stroke="url(#ld-gridfade)" stroke-width="1" fill="none">
      <line x1="0" y1="155" x2="720" y2="155"/>
      <line x1="0" y1="160" x2="720" y2="160"/>
      <line x1="0" y1="168" x2="720" y2="168"/>
      <line x1="0" y1="180" x2="720" y2="180"/>
      <line x1="0" y1="196" x2="720" y2="196"/>
    </g>
  </g>

  <g opacity="0.95">
    <line x1="40" y1="152" x2="680" y2="152" stroke="url(#ld-horizon)" stroke-width="1.25"/>
    <line class="flowline" x1="40" y1="152" x2="680" y2="152" stroke="url(#ld-horizon)"
          stroke-width="1.25" stroke-dasharray="3 9" opacity="0.85"/>
  </g>

  <g filter="url(#ld-glow)">
    <g transform="translate(84,118)">
      <path fill="url(#brand)" fill-rule="evenodd" d="M0 0 C-3.5 -14 -9 -24 -14 -33 C-17.5 -40 -18.5 -52 -16.5 -59 L-13 -64 L13 -64 L16.5 -59 C18.5 -52 17.5 -40 14 -33 C9 -24 3.5 -14 0 0 Z M-1.6 -10 L-1.6 -38 L1.6 -38 L1.6 -10 Z M-5.2 -43 A5.2 5.2 0 1 0 5.2 -43 A5.2 5.2 0 1 0 -5.2 -43 Z"/>
      <path fill="url(#brand)" d="M0 0 C18 3 40 9 72 9 C40 16 16 12 0 0 Z"/>
    </g>
    <text class="disp word" x="202" y="100" fill="url(#brand)">humanizer</text>
  </g>

  <line x1="176" y1="48" x2="176" y2="146" stroke="url(#ld-rule)" stroke-width="1.5"/>

  <text class="mono tag" x="204" y="130">55 patterns  &#183;  5 voices  &#183;  nothing leaves your machine</text>
</svg>

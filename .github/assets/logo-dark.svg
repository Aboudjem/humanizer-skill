<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" fill="none" role="img" aria-label="Humanizer: a red editing pen strikes through an AI-sounding phrase and writes a plain correction above it, then checks it off with a pop, on a loop. 55 patterns, 5 voices, 3 modes, zero dependencies.">
  <title>Humanizer</title>
  <desc>A red pen strikes through an AI-sounding phrase on a manuscript page, writes a plainer correction above it, and checks it off with a bounce, on a loop. Detect 55 AI writing patterns and rewrite text so it sounds like a human wrote it. 5 voices, 3 modes, zero dependencies.</desc>
  <defs>
    <radialGradient id="desk" cx="0.3" cy="0.15" r="1.15">
      <stop offset="0" stop-color="#1c2536"/>
      <stop offset="1" stop-color="#0f141e"/>
    </radialGradient>
    <filter id="pageShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="5" stdDev="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="708" height="208" rx="20" fill="url(#desk)" stroke="#e0574a" stroke-opacity="0.35" stroke-width="1.5"/>
  <rect x="6" y="6" width="708" height="4" rx="2" fill="#e0574a" opacity="0.85"/>

  <text x="40" y="98" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="54" font-weight="800" letter-spacing="-2" fill="#f0e9d8">Humanizer</text>
  <line x1="42" y1="114" x2="300" y2="114" stroke="#e0574a" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="258" stroke-dashoffset="258">
    <animate attributeName="stroke-dashoffset" values="258;0" dur="0.8s" begin="0.7s" calcMode="spline" keySplines="0.16 1 0.3 1" fill="freeze"/>
  </line>
  <text x="42" y="146" font-family="system-ui,-apple-system,sans-serif" font-size="17.5" font-weight="600" fill="#d7cdb6">Make AI text sound like a human wrote it.</text>
  <text x="42" y="174" font-family="system-ui,-apple-system,sans-serif" font-size="14.5" fill="#a9a08b">55 patterns &#183; 5 voices &#183; 3 modes &#183; zero dependencies</text>

  <g transform="translate(432,34)" filter="url(#pageShadow)">
    <rect x="0" y="0" width="252" height="150" rx="10" fill="#fffef9"/>

    <text x="18" y="46" font-family="Georgia,'Times New Roman',serif" font-size="15" fill="#2b2620">This comprehensive guide</text>
    <text x="18" y="74" font-family="Georgia,'Times New Roman',serif" font-size="15" fill="#2b2620">delves into the intricacies</text>
    <text x="18" y="102" font-family="Georgia,'Times New Roman',serif" font-size="15" fill="#2b2620">of authentication.</text>

    <line x1="18" y1="70" x2="88" y2="70" stroke="#c0392b" stroke-width="3" stroke-linecap="round" stroke-dasharray="70" stroke-dashoffset="70">
      <animate attributeName="stroke-dashoffset" values="70;70;0;0;70" keyTimes="0;0.06;0.2;0.82;1" dur="4.2s" begin="0.4s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.16 1 0.3 1;0 0 1 1;0.5 0 0.5 1"/>
    </line>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.22;0.3;0.82;1" dur="4.2s" begin="0.4s" repeatCount="indefinite"/>
      <path d="M20,66 C24,60 34,60 38,64" stroke="#c0392b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <g transform="translate(50,58)">
        <g>
          <animateTransform attributeName="transform" type="scale" values="0.4;1.35;0.95;1;1;0.4" keyTimes="0;0.35;0.5;0.6;0.9;1" dur="4.2s" begin="0.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.34 1.56 0.64 1;0.34 1.56 0.64 1;0.34 1.56 0.64 1;0 0 1 1;0.5 0 0.5 1"/>
          <text x="-32" y="4" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="13" fill="#c0392b">explains</text>
        </g>
      </g>
    </g>

    <g transform="translate(214,124)" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.38;0.44;0.82;1" dur="4.2s" begin="0.4s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="12" fill="none" stroke="#2f7d5b" stroke-width="2.5" opacity="0">
        <animate attributeName="opacity" values="0;0;0.6;0;0" keyTimes="0;0.42;0.47;0.6;1" dur="4.2s" begin="0.4s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="scale" values="1;1;1.7;1" keyTimes="0;0.42;0.6;1" dur="4.2s" begin="0.4s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.3 0 0.7 1;0 0 1 1"/>
      </circle>
      <g>
        <animateTransform attributeName="transform" type="scale" values="0.3;1.3;0.9;1;1;0.3" keyTimes="0;0.44;0.52;0.6;0.9;1" dur="4.2s" begin="0.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.34 1.56 0.64 1;0.34 1.56 0.64 1;0.34 1.56 0.64 1;0 0 1 1;0.5 0 0.5 1"/>
        <circle cx="0" cy="0" r="12" fill="none" stroke="#2f7d5b" stroke-width="2"/>
        <path d="M-5,0 L-1.5,4 L5,-4.5" stroke="#2f7d5b" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>
</svg>

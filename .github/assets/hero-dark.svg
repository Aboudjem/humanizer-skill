<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" fill="none" role="img"
     aria-label="humanizer, an AI writing humanizer and detector: reads like a person wrote it">
  <title>humanizer</title>
  <defs>
    <linearGradient id="hm-ground" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#171029"/>
      <stop offset="55%" stop-color="#0A0F1C"/>
      <stop offset="100%" stop-color="#080C18"/>
    </linearGradient>
    <radialGradient id="hm-bloomA" cx="0.15" cy="0.13" r="0.44">
      <stop offset="0%" stop-color="#C77DFF" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#C77DFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hm-bloomB" cx="0.88" cy="0.85" r="0.50">
      <stop offset="0%" stop-color="#FF4D8D" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#FF4D8D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hm-bloomC" cx="0.52" cy="0.04" r="0.36">
      <stop offset="0%" stop-color="#8E7BFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#8E7BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hm-wash" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#E0AEFF" stop-opacity="0.20"/>
      <stop offset="42%"  stop-color="#FF4D8D" stop-opacity="0.124"/>
      <stop offset="76%"  stop-color="#8E7BFF" stop-opacity="0.046"/>
      <stop offset="100%" stop-color="#8E7BFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="hm-frame"><rect width="1200" height="400"/></clipPath>
    <linearGradient id="hm-rule" gradientUnits="userSpaceOnUse" x1="500" y1="100" x2="500" y2="300">
      <stop offset="0%"   stop-color="#C77DFF" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#C77DFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF4D8D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hm-ink" gradientUnits="userSpaceOnUse" x1="44" y1="84" x2="214" y2="196">
      <stop class="hmk1" offset="0%"   stop-color="#E0AEFF"/>
      <stop class="hmk2" offset="52%"  stop-color="#C77DFF"/>
      <stop class="hmk3" offset="100%" stop-color="#FF4D8D"/>
    </linearGradient>
    <filter id="hm-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="5.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hm-glow-sm" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="3.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="hm-r1"><rect class="hmw1" x="42" y="158" width="174" height="19"/></clipPath>
    <clipPath id="hm-r2"><rect class="hmw2" x="42" y="190" width="174" height="19"/></clipPath>
    <linearGradient id="hm-word" x1="0" y1="0" x2="1" y2="0.25">
      <stop class="hmk1" offset="0%"   stop-color="#E0AEFF"/>
      <stop class="hmk2" offset="46%"  stop-color="#C77DFF"/>
      <stop class="hmk3" offset="100%" stop-color="#FF4D8D"/>
    </linearGradient>
    <linearGradient id="hm-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="hm-wordclip">
      <text x="76" y="286" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
            font-size="86" font-weight="800" letter-spacing="-3.0">humanizer</text>
    </clipPath>
  </defs>

  <style>
    .disp { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 4.5px; fill: #E0AEFF; }
    .head    { font-size: 34px; font-weight: 700; fill: #F2F6FF; letter-spacing: -0.5px; }
    .sub     { font-size: 16.5px; font-weight: 500; fill: #C2CDE4; }
    .tag     { font-size: 11.5px; letter-spacing: 1.6px; fill: #93A2BE; }
    .chip    { font-size: 11.5px; letter-spacing: 1.2px; fill: #C2CDE4; }
    @keyframes hm-breathe { 0%,100% { opacity:0.62; } 50% { opacity:1; } }
    .hmbloom { animation: hm-breathe 11s ease-in-out infinite; }
    @keyframes hm-sweep { 0% { transform: translateX(-360px); } 100% { transform: translateX(1560px); } }
    .hmwash { animation: hm-sweep 17s cubic-bezier(.5,0,.5,1) infinite; }
    @keyframes hm-sheen { 0% { transform: translateX(0); } 15%,100% { transform: translateX(395px); } }
    .hmsheen { animation: hm-sheen 8.5s cubic-bezier(.4,0,.3,1) infinite; }
    @keyframes hm-pip { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
    .hmp1 { animation: hm-pip 5s ease-in-out infinite 0.0s; }
    .hmp2 { animation: hm-pip 5s ease-in-out infinite 0.35s; }
    .hmp3 { animation: hm-pip 5s ease-in-out infinite 0.7s; }
    .hmp4 { animation: hm-pip 5s ease-in-out infinite 1.05s; }
    .hmp5 { animation: hm-pip 5s ease-in-out infinite 1.4s; }
    @keyframes hm-ride{0%{transform:translate(42.0px,102.0px)}2.9%{transform:translate(52.9px,93.2px)}5.7%{transform:translate(66.8px,92.4px)}8.6%{transform:translate(79.7px,98.2px)}11.4%{transform:translate(91.7px,105.5px)}14.3%{transform:translate(104.5px,111.4px)}17.1%{transform:translate(118.2px,111.1px)}20%{transform:translate(129.6px,102.5px)}22.9%{transform:translate(140.0px,93.6px)}25.7%{transform:translate(153.8px,91.9px)}28.6%{transform:translate(166.7px,97.1px)}31.4%{transform:translate(178.9px,104.1px)}34.3%{transform:translate(192.0px,109.3px)}37.1%{transform:translate(205.6px,107.3px)}40%{transform:translate(216.0px,98.0px)}88%{transform:translate(216.0px,98.0px)}100%{transform:translate(42.0px,102.0px)}}
    @keyframes hm-draw { 0% { stroke-dashoffset: 200; } 40% { stroke-dashoffset: 0; }
                        88% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 200; } }
    @keyframes hm-w1 { 0%,40% { width: 0; } 54%,90% { width: 174px; } 98%,100% { width: 0; } }
    @keyframes hm-w2 { 0%,48% { width: 0; } 62%,90% { width: 174px; } 98%,100% { width: 0; } }
    /* V3a: the nib and the ink it lays down must both be linear or the nib lags the stroke */
    .hmnib { transform: translate(216px, 98px); animation: hm-ride 7s linear infinite; }
    .hmstroke { stroke-dasharray: 200; animation: hm-draw 7s linear infinite; }
    .hmw1 { animation: hm-w1 7s cubic-bezier(.3,0,.2,1) infinite; }
    .hmw2 { animation: hm-w2 7s cubic-bezier(.3,0,.2,1) infinite; }
    @keyframes hm-k1 { 0%,100% { stop-color:#E0AEFF; } 50% { stop-color:#C77DFF; } }
    @keyframes hm-k2 { 0%,100% { stop-color:#C77DFF; } 50% { stop-color:#E86BC8; } }
    @keyframes hm-k3 { 0%,100% { stop-color:#FF4D8D; } 50% { stop-color:#C77DFF; } }
    .hmk1 { animation: hm-k1 14s ease-in-out infinite; }
    .hmk2 { animation: hm-k2 14s ease-in-out infinite; }
    .hmk3 { animation: hm-k3 14s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="1200" height="400" fill="url(#hm-ground)"/>
  <g class="hmbloom">
    <rect width="1200" height="400" fill="url(#hm-bloomA)"/>
    <rect width="1200" height="400" fill="url(#hm-bloomB)"/>
    <rect width="1200" height="400" fill="url(#hm-bloomC)"/>
  </g>
  <g clip-path="url(#hm-frame)">
    <g transform="translate(0,196)">
      <ellipse class="hmwash" cx="0" cy="0" rx="430" ry="300" fill="url(#hm-wash)"/>
    </g>
  </g>
  <g transform="translate(66,56) scale(0.5781)">
  <g opacity="0.32">
    <path d="M42 102 C72 66, 100 138, 130 102 C160 66, 186 136, 216 98" fill="none" stroke="url(#hm-ink)" stroke-width="13" stroke-linecap="round"/>
    <g fill="url(#hm-ink)"><rect x="42" y="158" width="74" height="17" rx="8.5"/><rect x="128" y="158" width="88" height="17" rx="8.5"/><rect x="42" y="190" width="96" height="17" rx="8.5"/><rect x="150" y="190" width="66" height="17" rx="8.5"/></g>
  </g>
  <g filter="url(#hm-glow)">
    <path class="hmstroke" d="M42 102 C72 66, 100 138, 130 102 C160 66, 186 136, 216 98" pathLength="200" fill="none"
          stroke="url(#hm-ink)" stroke-width="13" stroke-linecap="round"/>
  </g>
  <g fill="url(#hm-ink)" opacity="0.95"><g clip-path="url(#hm-r1)"><rect x="42" y="158" width="74" height="17" rx="8.5"/><rect x="128" y="158" width="88" height="17" rx="8.5"/></g><g clip-path="url(#hm-r2)"><rect x="42" y="190" width="96" height="17" rx="8.5"/><rect x="150" y="190" width="66" height="17" rx="8.5"/></g></g>
  <g class="hmnib">
    <g transform="rotate(-15)">
      <path fill="url(#hm-ink)" fill-rule="evenodd"
            d="M0 0 L-13 -38 C-15.5 -49 -13 -63 0 -72 C13 -63 15.5 -49 13 -38 Z
               M-2.2 -15 L-2.2 -43 L2.2 -43 L2.2 -15 Z
               M-6.4 -52 A6.4 6.4 0 1 0 6.4 -52 A6.4 6.4 0 1 0 -6.4 -52 Z"/>
    </g>
    <g filter="url(#hm-glow-sm)"><circle r="6" fill="#FFFFFF"/></g>
  </g>
  </g>
  <g filter="url(#hm-glow)">
    <text class="disp" x="76" y="286" font-size="86" font-weight="800"
          letter-spacing="-3.0" fill="url(#hm-word)">humanizer</text>
  </g>
  <g clip-path="url(#hm-wordclip)">
    <g transform="skewX(-18)">
      <rect class="hmsheen" x="-19" y="200" width="40"
            height="116" fill="url(#hm-sheen)" opacity="0.45"/>
    </g>
  </g>
  <line x1="500" y1="100" x2="500" y2="300" stroke="url(#hm-rule)" stroke-width="1.5"/>
  <g transform="translate(544,0)">
    <text class="mono eyebrow" x="0" y="134">AI WRITING HUMANIZER AND DETECTOR</text>
    <text class="disp head" x="0" y="186">Reads like a person wrote it</text>
    <text class="disp sub" x="0" y="222">55 patterns, 5 voices, zero setup, and nothing leaves your machine.</text>
    <g transform="translate(0,265)"><g class="hmp1"><circle cx="0" cy="0" r="4.5" fill="#C77DFF" filter="url(#hm-glow-sm)"/></g><g class="hmp2"><circle cx="22" cy="0" r="4.5" fill="#C77DFF" filter="url(#hm-glow-sm)"/></g><g class="hmp3"><circle cx="44" cy="0" r="4.5" fill="#C77DFF" filter="url(#hm-glow-sm)"/></g><g class="hmp4"><circle cx="66" cy="0" r="4.5" fill="#C77DFF" filter="url(#hm-glow-sm)"/></g><g class="hmp5"><circle cx="88" cy="0" r="4.5" fill="#C77DFF" filter="url(#hm-glow-sm)"/></g><text class="mono tag" x="124" y="4">FIVE VOICES</text></g>
  </g>
  <text class="mono tag" x="76" y="352">one markdown file  &#183;  55 patterns  &#183;  nothing leaves your machine</text>
</svg>

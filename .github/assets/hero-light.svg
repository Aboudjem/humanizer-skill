<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" fill="none" role="img" aria-label="humanizer, an AI writing humanizer and detector: reads like a person wrote it. 55 patterns, 5 voices, zero setup, and nothing leaves your machine.">
  <title>humanizer</title>
  <desc>The humanizer wordmark under a pen nib mark on a light ground, beside the line Reads like a person wrote it, a row of five voice pips, and the traits one markdown file, 55 patterns, nothing leaves your machine.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0.25" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#A836FF"/>
      <stop offset="100%" stop-color="#EB0054"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-0.10 0; 0.10 0; -0.10 0" dur="18s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="hl-rule" gradientUnits="userSpaceOnUse" x1="452" y1="112" x2="452" y2="300">
      <stop offset="0%" stop-color="#A836FF" stop-opacity="0"/>
      <stop offset="45%" stop-color="#A836FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#EB0054" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="hl-horizonline" gradientUnits="userSpaceOnUse" x1="60" y1="332" x2="1140" y2="332">
      <stop offset="0%" stop-color="#A836FF" stop-opacity="0"/>
      <stop offset="22%" stop-color="#A836FF" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#A836FF" stop-opacity="0.55"/>
      <stop offset="82%" stop-color="#EB0054" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#EB0054" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="hl-gridfade" gradientUnits="userSpaceOnUse" x1="0" y1="332" x2="0" y2="400">
      <stop offset="0%" stop-color="#A836FF" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#725BFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#EB0054" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="hl-pips" gradientUnits="userSpaceOnUse" x1="-6" y1="0" x2="94" y2="0">
      <stop offset="0%" stop-color="#725BFF"/>
      <stop offset="50%" stop-color="#A836FF"/>
      <stop offset="100%" stop-color="#EB0054"/>
    </linearGradient>

    <linearGradient id="hl-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="hl-gridclip"><rect x="0" y="332" width="1200" height="68"/></clipPath>
    <clipPath id="hl-wordclip">
      <text x="82" y="286" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
            font-size="70" font-weight="800" letter-spacing="-2.5">humanizer</text>
    </clipPath>
  </defs>

  <style>
    .disp { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .word    { font-size: 70px; font-weight: 800; letter-spacing: -2.5px; }
    .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 4.5px; fill: #A836FF; }
    .head    { font-size: 36px; font-weight: 700; fill: #07070C; letter-spacing: -0.5px; }
    .sub     { font-size: 16px; font-weight: 500; fill: #1A2233; }
    .tag     { font-size: 11.5px; letter-spacing: 1.6px; fill: #48546B; }

    @keyframes hl-flow { to { stroke-dashoffset: -240; } }
    .flowline { animation: hl-flow 14s linear infinite; }

    @keyframes hl-dot { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }
    .d1 { animation: hl-dot 5s ease-in-out infinite 0s; }
    .d2 { animation: hl-dot 5s ease-in-out infinite 0.35s; }
    .d3 { animation: hl-dot 5s ease-in-out infinite 0.7s; }
    .d4 { animation: hl-dot 5s ease-in-out infinite 1.05s; }
    .d5 { animation: hl-dot 5s ease-in-out infinite 1.4s; }

    @keyframes hl-sheen {
      0%   { transform: translateX(0); }
      34%  { transform: translateX(760px); }
      100% { transform: translateX(760px); }
    }
    .sheen { animation: hl-sheen 7.5s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <rect width="1200" height="400" fill="#F7F8FB"/>

  <g id="grid" clip-path="url(#hl-gridclip)" opacity="0">
    <g stroke="url(#hl-gridfade)" stroke-width="1" fill="none">
      <path d="M600 332 L-1180 400"/><path d="M600 332 L-560 400"/><path d="M600 332 L-190 400"/>
      <path d="M600 332 L40 400"/>   <path d="M600 332 L200 400"/>  <path d="M600 332 L320 400"/>
      <path d="M600 332 L415 400"/>  <path d="M600 332 L490 400"/>  <path d="M600 332 L548 400"/>
      <path d="M600 332 L600 400"/>
      <path d="M600 332 L652 400"/>  <path d="M600 332 L710 400"/>  <path d="M600 332 L785 400"/>
      <path d="M600 332 L880 400"/>  <path d="M600 332 L1000 400"/> <path d="M600 332 L1160 400"/>
      <path d="M600 332 L1390 400"/> <path d="M600 332 L1760 400"/> <path d="M600 332 L2380 400"/>
    </g>
    <g stroke="url(#hl-gridfade)" stroke-width="1" fill="none">
      <line x1="0" y1="335"   x2="1200" y2="335"/>
      <line x1="0" y1="339.5" x2="1200" y2="339.5"/>
      <line x1="0" y1="345.5" x2="1200" y2="345.5"/>
      <line x1="0" y1="353.5" x2="1200" y2="353.5"/>
      <line x1="0" y1="364"   x2="1200" y2="364"/>
      <line x1="0" y1="378"   x2="1200" y2="378"/>
      <line x1="0" y1="396"   x2="1200" y2="396"/>
    </g>
  </g>

  <g>
    <line x1="60" y1="332" x2="1140" y2="332" stroke="#D8DEE9" stroke-width="1.25"/>
    <line class="flowline" x1="60" y1="332" x2="1140" y2="332" stroke="url(#hl-horizonline)"
          stroke-width="1.5" stroke-dasharray="3 9"/>
  </g>

  <g>
    <g transform="translate(100,178) scale(1.3)">
      <path fill="url(#brand)" fill-rule="evenodd" d="M0 0 C-3.5 -14 -9 -24 -14 -33 C-17.5 -40 -18.5 -52 -16.5 -59 L-13 -64 L13 -64 L16.5 -59 C18.5 -52 17.5 -40 14 -33 C9 -24 3.5 -14 0 0 Z M-1.6 -10 L-1.6 -38 L1.6 -38 L1.6 -10 Z M-5.2 -43 A5.2 5.2 0 1 0 5.2 -43 A5.2 5.2 0 1 0 -5.2 -43 Z"/>
      <path fill="url(#brand)" d="M0 0 C18 3 40 9 72 9 C40 16 16 12 0 0 Z"/>
    </g>
    <text class="disp word" x="82" y="286" fill="url(#brand)">humanizer</text>
  </g>

  <g clip-path="url(#hl-wordclip)">
    <g transform="skewX(-18)">
      <rect class="sheen" x="-220" y="180" width="120" height="140" fill="url(#hl-sheen)" opacity="0.6"/>
    </g>
  </g>

  <line x1="452" y1="112" x2="452" y2="300" stroke="url(#hl-rule)" stroke-width="1.5"/>

  <g transform="translate(500,0)">
    <text class="mono eyebrow" x="0" y="140">AI WRITING HUMANIZER AND DETECTOR</text>
    <text class="disp head"    x="0" y="196">Reads like a person wrote it</text>
    <text class="disp sub"     x="0" y="232">55 patterns, 5 voices, zero setup, and nothing leaves your machine.</text>

    <g transform="translate(0,276)">
      <g class="d1"><circle cx="0"   cy="0" r="4.5" fill="url(#hl-pips)"/></g>
      <g class="d2"><circle cx="22"  cy="0" r="4.5" fill="url(#hl-pips)"/></g>
      <g class="d3"><circle cx="44"  cy="0" r="4.5" fill="url(#hl-pips)"/></g>
      <g class="d4"><circle cx="66"  cy="0" r="4.5" fill="url(#hl-pips)"/></g>
      <g class="d5"><circle cx="88"  cy="0" r="4.5" fill="url(#hl-pips)"/></g>
      <text class="mono tag" x="114" y="4">FIVE VOICES</text>
    </g>

    <text class="mono tag" x="0" y="310">one markdown file  &#183;  55 patterns  &#183;  nothing leaves your machine</text>
  </g>
</svg>

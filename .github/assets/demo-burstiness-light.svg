<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" fill="none" role="img" aria-label="Sentence-length chart looping between AI (flat, uniform) and human (varied, 3 to 31 words). Humanizer restores the burstiness.">
  <title>Burstiness: AI is flat, humans vary</title>
  <desc>Thirteen sentence-length bars loop from a flat, uniform AI baseline to a varied human skyline (3 to 31 words) and back. Burstiness goes from about zero to plus 0.74.</desc>
  <defs>
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#22436b"/>
      <stop offset="1" stop-color="#4a79a6"/>
    </linearGradient>
    <radialGradient id="desk" cx="0.3" cy="0.12" r="1.1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#f2ebdb"/>
    </radialGradient>
    <filter id="barShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDev="2.5" flood-color="#7a6a4a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect x="8" y="10" width="704" height="180" rx="20" fill="url(#desk)" stroke="#c0952f" stroke-opacity="0.3" stroke-width="1.5"/>
  <rect x="8" y="10" width="704" height="4" rx="2" fill="url(#barGrad)" opacity="0.9"/>

  <g opacity="1">
    <animate attributeName="opacity" values="1;0;0;1" keyTimes="0;0.14;0.86;1" dur="6.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1"/>
    <circle cx="44" cy="36" r="4" fill="#b4552d"/>
    <text x="56" y="40" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#b4552d">AI</text>
    <text x="76" y="40" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#8a7f6b">· flat, uniform rhythm (every sentence ≈18 words)</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.16;0.86;1" dur="6.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1"/>
    <circle cx="44" cy="36" r="4" fill="#2f7d5b"/>
    <text x="56" y="40" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#2f7d5b">Human</text>
    <text x="108" y="40" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#8a7f6b">· natural burstiness (3 to 31 words per sentence)</text>
  </g>

  <g stroke="#e7dcc6" stroke-width="1">
    <line x1="40" y1="160" x2="548" y2="160"/>
    <line x1="40" y1="124" x2="548" y2="124" stroke-opacity="0.85"/>
    <line x1="40" y1="88" x2="548" y2="88" stroke-opacity="0.65"/>
  </g>
  <line x1="40" y1="130" x2="548" y2="130" stroke="#b4552d" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0;0;0.6" keyTimes="0;0.14;0.86;1" dur="6.5s" repeatCount="indefinite"/>
  </line>

  <g filter="url(#barShadow)">
    <rect x="40"  y="130" width="28" rx="4" height="30" fill="url(#barGrad)"><animate attributeName="height" values="30;22;22;30" keyTimes="0;0.14;0.86;1" dur="6.5s" begin="0.00s" repeatCount="indefinite" calcMode="spline" keySplines="0.16 1 0.3 1;0 0 1 1;0.5 0 0.5 1"/><animate attributeName="y" values="130;138;138;130" keyTimes="0;0.14;0.86;1" dur="6.5s" begin="0.00s" repeatCount="indefinite" calcMode="spline" keySplines="0.16 1 0.3 1;0 0 1 1;0.5 0 0.5 1"/></rect>
    <rect x="80"  y="130" width="28" rx="4" height="30" fill="url(#barGrad)"><animate attributeName="height" values="30;88;88;30" keyTimes="0;0.14;0.86;1" dur="6.5s" begin="0.05s" repeatCount="indefinite" calcMode="spline" keySplines="0.16 1 0.3 1;0 0 1 1;0.5 0 0.5 1"/><animate attributeName="y" values="130;72;72;130" keyTimes="0;0.14;0.86;1" dur="6.5s" begin="0.05s" repeatCount="indefinite" calcMode="spline" keySplines="0.16 1 0.3 1;0 0 1 1;0.5 0 0.5 1"/></rect>
    <rect x="120" y="130" width="28" rx="4" height="30" fill="url(#barGrad)"><animate attributeName="height" values="30;40;40;30" keyTimes="0;0.14;0.86;1" dur="6.5s" begin="0.10s" repeatCount="indefinite" calcMode="spline" keySplines="0.16 1 0.3 1;0 0 1 1;0.5 0 0.5 1"/><animate attributeName="y" values="130;120;120;130" keyTimes="0;0.14;0.86;1" dur="6.5s" begin="0.10s" repeatCount="indefinite" calcMode="spline" keySplines="0.16 1 0.3 1;0 0 1 1;0.5 0 0.5 1"/></rect>
    <rect x="160" y="130" width="28" rx="4" height="30" fill="url(#barGrad)"><animate attributeName="height" values="30;14;14;30" keyTimes="0;0.14;0.86;1" dur="6.5s" begin="0.15s" repeatCount="indefinite" calcMode="spline" keySplines="0.16 1 0.3 1;0 0 1 1;0.5 0 0.5 1"/><animate attributeName="y" values="130;146;146;130" keyTimes="0;0.14;0.86;1" dur="6.5s" begin="0.15s" repeatCount="indefinite" calcMode="spline" keySplines="0.16 1 0.3 1;0 0 1 1;0.5 0 0.5 1"/></rect>
    <rect x="200" y="130" width="28" rx="4" height="30" fill="url(#barGrad)"><animate attributeName="height" values="30;68;68;30" keyTimes="0;0.14;0.86;1" dur="6.5s" begin="0.20s" repeatCount="indefinite" calcMode="spline" keySplines="0.16 1 0.3 1;0 0 1 1;0.5 0 0.5 1"/><animate attributeName="y" values="130;92;92;130" keyTimes="0;0.14;0.86;1" dur="6.5s" begin="0.20s" repeatCount="indefinite" calcMode="spline" keySplines="0.16 1 0.3 1;0 0 1 1;0.5 0 0.5 1"/></rect>
    <rect x="240" y="130" width="28" rx="4" height="30" fill="url(#barGrad)"><animate attributeName="height" values="30;30;30;30" keyTimes="0;0.14;0.86;1" dur="6.5s" begin="0.25s" repeatCount="indefinite" calcMode="spline" keySplines="0.16 1 0.3 1;0 0 1 1;0.5 0 0.5 1"/><animate attributeName="y" values="130;130;130;130" keyTimes="0;0.14;0.86;1" dur="6.5s" begin="0.25s" repeatCount="indefinite" calcMode="spline" keySplines="0.16 1 0.3 1;0 0 1 1;0.5 0 0.5 1"/></rect>
    <rect x="280" y="130" width="28" rx="4" height="30" fill="url(#barGrad)"><animate attributeName="height" values="30;96;96;30" keyTimes="0;0.14;0.86;1" dur="6.5s" begin="0.30s" repeatCount="indefinite" calcMode="spline" keySplines="0.16 1 0.3 1;0 0 1 1;0.5 0 0.5 1"/><animate attributeName="y" values="130;64;64;130" keyTimes="0;0.14;0.86;1" dur="6.5s" begin="0.30s" repeatCount="indefinite" calcMode="spline" keySplines="0.16 1 0.3 1;0 0 1 1;0.5 0 0.5 1"/></rect>
    <rect x="320" y="130" width="28" rx="4" height="30" fill="url(#barGrad)"><animate attributeName="height" values="30;18;18;30" keyTimes="0;0.14;0.86;1" dur="6.5s" begin="0.35s" repeatCount="indefinite" calcMode="spline" keySplines="0.16 1 0.3 1;0 0 1 1;0.5 0 0.5 1"/><animate attributeName="y" values="130;142;142;130" keyTimes="0;0.14;0.86;1" dur="6.5s" begin="0.35s" repeatCount="indefinite" calcMode="spline" keySplines="0.16 1 0.3 1;0 0 1 1;0.5 0 0.5 1"/></rect>
    <rect x="360" y="130" width="28" rx="4" height="30" fill="url(#barGrad)"><animate attributeName="height" values="30;78;78;30" keyTimes="0;0.14;0.86;1" dur="6.5s" begin="0.40s" repeatCount="indefinite" calcMode="spline" keySplines="0.16 1 0.3 1;0 0 1 1;0.5 0 0.5 1"/><animate attributeName="y" values="130;82;82;130" keyTimes="0;0.14;0.86;1" dur="6.5s" begin="0.40s" repeatCount="indefinite" calcMode="spline" keySplines="0.16 1 0.3 1;0 0 1 1;0.5 0 0.5 1"/></rect>
    <rect x="400" y="130" width="28" rx="4" height="30" fill="url(#barGrad)"><animate attributeName="height" values="30;36;36;30" keyTimes="0;0.14;0.86;1" dur="6.5s" begin="0.45s" repeatCount="indefinite" calcMode="spline" keySplines="0.16 1 0.3 1;0 0 1 1;0.5 0 0.5 1"/><animate attributeName="y" values="130;124;124;130" keyTimes="0;0.14;0.86;1" dur="6.5s" begin="0.45s" repeatCount="indefinite" calcMode="spline" keySplines="0.16 1 0.3 1;0 0 1 1;0.5 0 0.5 1"/></rect>
    <rect x="440" y="130" width="28" rx="4" height="30" fill="url(#barGrad)"><animate attributeName="height" values="30;12;12;30" keyTimes="0;0.14;0.86;1" dur="6.5s" begin="0.50s" repeatCount="indefinite" calcMode="spline" keySplines="0.16 1 0.3 1;0 0 1 1;0.5 0 0.5 1"/><animate attributeName="y" values="130;148;148;130" keyTimes="0;0.14;0.86;1" dur="6.5s" begin="0.50s" repeatCount="indefinite" calcMode="spline" keySplines="0.16 1 0.3 1;0 0 1 1;0.5 0 0.5 1"/></rect>
    <rect x="480" y="130" width="28" rx="4" height="30" fill="url(#barGrad)"><animate attributeName="height" values="30;58;58;30" keyTimes="0;0.14;0.86;1" dur="6.5s" begin="0.55s" repeatCount="indefinite" calcMode="spline" keySplines="0.16 1 0.3 1;0 0 1 1;0.5 0 0.5 1"/><animate attributeName="y" values="130;102;102;130" keyTimes="0;0.14;0.86;1" dur="6.5s" begin="0.55s" repeatCount="indefinite" calcMode="spline" keySplines="0.16 1 0.3 1;0 0 1 1;0.5 0 0.5 1"/></rect>
    <rect x="520" y="130" width="28" rx="4" height="30" fill="url(#barGrad)"><animate attributeName="height" values="30;46;46;30" keyTimes="0;0.14;0.86;1" dur="6.5s" begin="0.60s" repeatCount="indefinite" calcMode="spline" keySplines="0.16 1 0.3 1;0 0 1 1;0.5 0 0.5 1"/><animate attributeName="y" values="130;114;114;130" keyTimes="0;0.14;0.86;1" dur="6.5s" begin="0.60s" repeatCount="indefinite" calcMode="spline" keySplines="0.16 1 0.3 1;0 0 1 1;0.5 0 0.5 1"/></rect>
  </g>

  <g opacity="0" font-family="system-ui,-apple-system,sans-serif" font-weight="700" fill="#4c1d95" font-size="9" text-anchor="middle">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.24;0.86;1" dur="6.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1"/>
    <text x="294" y="58">31</text>
    <text x="94" y="66">29</text>
    <text x="374" y="76">26</text>
    <text x="174" y="140" fill="#b98a34">4</text>
    <text x="454" y="142" fill="#b98a34">3</text>
  </g>

  <g opacity="1">
    <animate attributeName="opacity" values="1;0;0;1" keyTimes="0;0.14;0.86;1" dur="6.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1"/>
    <rect x="574" y="56" width="122" height="96" rx="12" fill="#fbeee6" stroke="#b4552d" stroke-opacity="0.5" stroke-width="1"/>
    <text x="590" y="80" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#b4552d">AI · uniform</text>
    <text x="590" y="98" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#8a7f6b">18, 18, 19, 18…</text>
    <text x="590" y="122" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#8a7f6b">Burstiness</text>
    <text x="590" y="142" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="800" fill="#b4552d">−0.02</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.16;0.86;1" dur="6.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1"/>
    <rect x="574" y="56" width="122" height="96" rx="12" fill="#edf3ee" stroke="#2f7d5b" stroke-opacity="0.5" stroke-width="1"/>
    <text x="590" y="80" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#2f7d5b">Human · varied</text>
    <text x="590" y="98" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#8a7f6b">3 → 31 words</text>
    <text x="590" y="122" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#8a7f6b">Burstiness</text>
    <text x="590" y="142" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="800" fill="#b98a34">+0.74</text>
  </g>

  <text x="40" y="182" font-family="system-ui,-apple-system,sans-serif" font-size="10.5" font-weight="700" fill="#1f3a5f">humanizer</text>
  <text x="112" y="182" font-family="system-ui,-apple-system,sans-serif" font-size="10.5" fill="#8a7f6b">restores the rhythm humans actually write in</text>
</svg>

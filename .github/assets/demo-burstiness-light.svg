<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" fill="none" role="img" aria-label="Sentence-length chart looping between AI (flat, uniform) and human (varied, 3 to 31 words). Humanizer restores the burstiness.">
  <title>Burstiness: AI is flat, humans vary</title>
  <desc>Thirteen sentence-length bars loop from a flat, uniform AI baseline to a varied human skyline (3 to 31 words) and back. Burstiness goes from about zero to plus 0.74.</desc>
  <defs>
    <linearGradient id="bl-bars" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="548" y2="0">
      <stop offset="0%" stop-color="#A836FF"/>
      <stop offset="100%" stop-color="#EB0054"/>
    </linearGradient>

    <linearGradient id="bl-axis" gradientUnits="userSpaceOnUse" x1="40" y1="160" x2="548" y2="160">
      <stop offset="0%" stop-color="#A836FF" stop-opacity="0"/>
      <stop offset="30%" stop-color="#A836FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#EB0054" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <style>
    .disp { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .lede  { font-size: 13px; fill: #1A2233; }
    .cardt { font-size: 11px; font-weight: 700; }
    .cardm { font-size: 10px; fill: #48546B; }
    .big   { font-size: 20px; font-weight: 800; }
    .pk    { font-size: 9px; font-weight: 700; fill: #1A2233; }
    .tag   { font-size: 10.5px; letter-spacing: 0.6px; fill: #48546B; }
    .wm    { font-size: 11px; font-weight: 800; fill: #07070C; }

    @keyframes bl-ai    { 0%,40% { opacity: 1; }   48%,92% { opacity: 0; }   100% { opacity: 1; } }
    @keyframes bl-hum   { 0%,40% { opacity: 0; }   48%,92% { opacity: 1; }   100% { opacity: 0; } }

    .ai    { animation: bl-ai 8s ease-in-out infinite; }
    .hum   { animation: bl-hum 8s ease-in-out infinite; }

    @keyframes bl-flow { to { stroke-dashoffset: -240; } }
    .flowline { animation: bl-flow 14s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <rect width="720" height="200" fill="#F7F8FB"/>

  <g class="ai" opacity="0">
    <circle cx="44" cy="36" r="4" fill="#48546B"/>
    <text class="disp lede" x="56" y="40"><tspan font-weight="700" fill="#48546B">AI</tspan>  &#183;  flat, uniform rhythm (every sentence &#8776;18 words)</text>
  </g>
  <g class="hum" opacity="1">
    <circle cx="44" cy="36" r="4" fill="#A836FF"/>
    <text class="disp lede" x="56" y="40"><tspan font-weight="700" fill="#A836FF">Human</tspan>  &#183;  natural burstiness (3 to 31 words per sentence)</text>
  </g>

  <line x1="40" y1="104" x2="548" y2="104" stroke="#48546B" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.6"/>
  <text class="mono" x="34" y="107" font-size="8.5" text-anchor="end" fill="#48546B">&#8776;18</text>

  <g class="ai" opacity="0" fill="#48546B">
    <rect x="40"  y="104" width="28" height="56" rx="4"/>
    <rect x="80"  y="104" width="28" height="56" rx="4"/>
    <rect x="120" y="104" width="28" height="56" rx="4"/>
    <rect x="160" y="104" width="28" height="56" rx="4"/>
    <rect x="200" y="104" width="28" height="56" rx="4"/>
    <rect x="240" y="104" width="28" height="56" rx="4"/>
    <rect x="280" y="104" width="28" height="56" rx="4"/>
    <rect x="320" y="104" width="28" height="56" rx="4"/>
    <rect x="360" y="104" width="28" height="56" rx="4"/>
    <rect x="400" y="104" width="28" height="56" rx="4"/>
    <rect x="440" y="104" width="28" height="56" rx="4"/>
    <rect x="480" y="104" width="28" height="56" rx="4"/>
    <rect x="520" y="104" width="28" height="56" rx="4"/>
  </g>

  <g class="hum" opacity="1" fill="url(#bl-bars)">
    <rect x="40"  y="138" width="28" height="22" rx="4"/>
    <rect x="80"  y="72"  width="28" height="88" rx="4"/>
    <rect x="120" y="120" width="28" height="40" rx="4"/>
    <rect x="160" y="146" width="28" height="14" rx="4"/>
    <rect x="200" y="92"  width="28" height="68" rx="4"/>
    <rect x="240" y="130" width="28" height="30" rx="4"/>
    <rect x="280" y="64"  width="28" height="96" rx="4"/>
    <rect x="320" y="142" width="28" height="18" rx="4"/>
    <rect x="360" y="82"  width="28" height="78" rx="4"/>
    <rect x="400" y="124" width="28" height="36" rx="4"/>
    <rect x="440" y="148" width="28" height="12" rx="4"/>
    <rect x="480" y="102" width="28" height="58" rx="4"/>
    <rect x="520" y="114" width="28" height="46" rx="4"/>
  </g>

  <g class="hum" opacity="1" text-anchor="middle">
    <text class="disp pk" x="294" y="58">31</text>
    <text class="disp pk" x="94"  y="66">29</text>
    <text class="disp pk" x="374" y="76">26</text>
    <text class="disp pk" x="174" y="140">4</text>
    <text class="disp pk" x="454" y="142">3</text>
  </g>

  <g>
    <line x1="40" y1="160" x2="548" y2="160" stroke="#D8DEE9" stroke-width="1.25"/>
    <line class="flowline" x1="40" y1="160" x2="548" y2="160" stroke="url(#bl-axis)"
          stroke-width="1.5" stroke-dasharray="3 9"/>
  </g>

  <rect x="574" y="56" width="122" height="96" rx="12" fill="#FFFFFF" stroke="#D8DEE9" stroke-width="1"/>
  <g class="ai" opacity="0">
    <text class="disp cardt" x="590" y="80" fill="#48546B">AI &#183; uniform</text>
    <text class="disp cardm" x="590" y="98">18, 18, 19, 18&#8230;</text>
    <text class="disp cardm" x="590" y="122">Burstiness</text>
    <text class="disp big"   x="590" y="142" fill="#AB6600">&#8722;0.02</text>
  </g>
  <g class="hum" opacity="1">
    <text class="disp cardt" x="590" y="80" fill="#A836FF">Human &#183; varied</text>
    <text class="disp cardm" x="590" y="98">3 &#8594; 31 words</text>
    <text class="disp cardm" x="590" y="122">Burstiness</text>
    <text class="disp big"   x="590" y="142" fill="#0E8571">+0.74</text>
  </g>

  <text class="disp wm"  x="40"  y="184">humanizer</text>
  <text class="disp tag" x="112" y="184">restores the rhythm humans actually write in</text>
</svg>

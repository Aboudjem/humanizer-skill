name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(node -p "require('./.claude-plugin/plugin.json').version")
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

      - name: Verify tag matches plugin.json
        if: github.ref_type == 'tag'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PLUGIN_VERSION=$(node -p "require('./.claude-plugin/plugin.json').version")
          if [ "$TAG_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match .claude-plugin/plugin.json version $PLUGIN_VERSION."
            echo "Bump plugin.json to $TAG_VERSION, or retag as v$PLUGIN_VERSION, then release again."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches plugin.json."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: v${{ steps.version.outputs.value }}
          generate_release_notes: true
          draft: false
          prerelease: false

  sync-10x:
    name: Sync 10x marketplace
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch plugin-released to 10x
        env:
          DISPATCH_TOKEN: ${{ secrets.TEN_X_DISPATCH_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "TEN_X_DISPATCH_TOKEN secret not set; skipping 10x sync."
            exit 0
          fi
          HTTP_CODE=$(curl -sS -o /tmp/dispatch.json -w "%{http_code}" -X POST \
            -H "Authorization: token $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Aboudjem/10x/dispatches \
            -d "{\"event_type\":\"plugin-released\",\"client_payload\":{\"plugin\":\"humanizer\",\"version\":\"$VERSION\"}}")
          if [ "$HTTP_CODE" != "204" ]; then
            echo "10x dispatch failed with HTTP $HTTP_CODE:"
            cat /tmp/dispatch.json
            echo "Rotate TEN_X_DISPATCH_TOKEN at https://github.com/Aboudjem/humanizer-skill/settings/secrets/actions"
            exit 1
          fi
          echo "10x dispatch succeeded (HTTP 204)."

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Skill
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          for file in README.md LICENSE CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md CHANGELOG.md; do
            if [ ! -f "$file" ]; then
              echo "FAIL: Missing $file"
              exit 1
            fi
          done
          if [ ! -f "skills/humanizer/SKILL.md" ]; then
            echo "FAIL: Missing skills/humanizer/SKILL.md"
            exit 1
          fi
          echo "All required files present"

      - name: Validate SKILL.md structure
        run: |
          SKILL="skills/humanizer/SKILL.md"
          for section in "## Step 2: Detect AI Patterns" "Voice Profiles" "Soul Injection"; do
            if ! grep -q "$section" "$SKILL"; then
              echo "FAIL: Missing section '$section' in SKILL.md"
              exit 1
            fi
          done
          echo "SKILL.md structure valid"

      - name: Check pattern count
        run: |
          COUNT=$(grep -cE "^\\*\\*P[0-9]+: " skills/humanizer/SKILL.md || true)
          EXPECTED=55
          if [ "$COUNT" -lt "$EXPECTED" ]; then
            echo "FAIL: Expected at least $EXPECTED patterns, found $COUNT"
            exit 1
          fi
          echo "Pattern count OK: $COUNT patterns (>= $EXPECTED)"

      - name: No em dashes in SKILL.md or README
        run: |
          # SKILL.md treats em dashes as a banned pattern (P13). Skill itself must not violate its own rule.
          if grep -lP '[\x{2014}]' skills/humanizer/SKILL.md README.md 2>/dev/null; then
            echo "FAIL: em dash (U+2014) found in core docs (violates P13)"
            grep -nP '[\x{2014}]' skills/humanizer/SKILL.md README.md || true
            exit 1
          fi
          echo "Zero em dashes in core docs"

      - name: Pattern badge matches actual count
        run: |
          BADGE=$(grep -oE 'patterns-[0-9]+' README.md | head -1 | grep -oE '[0-9]+')
          ACTUAL=$(grep -cE "^\\*\\*P[0-9]+: " skills/humanizer/SKILL.md)
          if [ "$BADGE" != "$ACTUAL" ]; then
            echo "FAIL: README badge says $BADGE patterns, SKILL.md has $ACTUAL"
            exit 1
          fi
          echo "Badge count matches: $BADGE"

      - name: No internal files leaked
        run: |
          # Check git-tracking, not on-disk existence: local dev dirs (.omc, .goal)
          # are gitignored and never checked out in CI, but this keeps local and CI runs in agreement.
          FOUND=0
          for dir in .planning .deep-research .omc .goal; do
            if [ -n "$(git ls-files "$dir")" ]; then
              echo "FAIL: Internal directory $dir is tracked in git"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then exit 1; fi
          echo "No internal files leaked"

      - name: References present
        run: |
          for f in skills/humanizer/references/patterns.md skills/humanizer/references/always-on-templates.md; do
            if [ ! -f "$f" ]; then
              echo "FAIL: Missing $f"
              exit 1
            fi
          done
          echo "Reference files present"

  cli:
    name: CLI (metrics + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    strategy:
      fail-fast: false
      matrix:
        # package.json declares engines.node >= 18, so 18 is tested, not just asserted.
        node-version: ['18', '20']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # eslint 10 requires Node ^20.19 || ^22.13 || >=24, so linting runs on 20 only.
      # The CLI itself is stdlib-only and runs on 18.
      - name: Install lint dependencies
        if: matrix.node-version == '20'
        working-directory: cli
        run: npm install --no-save --no-audit --no-fund eslint

      - name: Lint (cli/ JS)
        if: matrix.node-version == '20'
        working-directory: cli
        run: npx eslint .

      - name: Unit and smoke tests (zero dependencies)
        working-directory: cli
        run: node --test

      - name: CLI smoke run
        run: |
          node cli/index.js score examples/blog-post/after.md
          node cli/index.js compare --before examples/blog-post/before.md --after examples/blog-post/after.md

      - name: Pre-commit hook manifest is well-formed
        run: |
          node -e "
            const fs = require('fs');
            const raw = fs.readFileSync('.pre-commit-hooks.yaml', 'utf8');
            const ids = raw.split('\n').filter(l => l.startsWith('- id: ')).map(l => l.slice(6).trim());
            if (!ids.includes('humanizer-scan')) throw new Error('missing humanizer-scan hook id');
            if (!ids.includes('humanizer-scan-staged')) throw new Error('missing humanizer-scan-staged hook id');
            if (raw.indexOf('entry: cli/index.js') === -1) throw new Error('entry does not point at cli/index.js');
            const staged = raw.slice(raw.indexOf('- id: humanizer-scan-staged'));
            if (!staged.includes('entry: cli/index.js scan --fail-above 40')) throw new Error('staged hook must run scan with a threshold and no path');
            if (!staged.includes('pass_filenames: true')) throw new Error('staged hook must pass filenames');
            if (!staged.includes('(md|markdown|txt)')) throw new Error('staged hook must keep the md/markdown/txt filter');
            if (!fs.existsSync('cli/index.js')) throw new Error('cli/index.js missing');
            const mode = fs.statSync('cli/index.js').mode;
            if (!(mode & 0o111)) throw new Error('cli/index.js is not executable (required for language: script)');
            console.log('.pre-commit-hooks.yaml OK');
          "
